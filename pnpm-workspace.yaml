packages:
  - "apps/*"
  - "packages/*"
# Native binaries needed at runtime — allow their postinstall scripts.
# `allowBuilds` is the pnpm 12 key (map form); `onlyBuiltDependencies` is the
# legacy list form and is rejected by `pnpm install --frozen-lockfile` in CI.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  lightningcss: true
minimumReleaseAgeExclude:
  - "@astrojs/cloudflare@14.4.8"
  - "@astrojs/markdown-satteri@0.4.10"
  - "@astrojs/vite-plugin-astro@0.1.3"
  - astro@7.4.12
  - miniflare@5.20261113.0-beta
  - wrangler@4.162.0
  - "@better-auth/core@1.7.23"
  - "@better-auth/drizzle-adapter@1.7.23"
  - "@better-auth/kysely-adapter@1.7.23"
  - "@better-auth/memory-adapter@1.7.23"
  - "@better-auth/mongo-adapter@1.7.23"
  - "@better-auth/prisma-adapter@1.7.23"
  - "@better-auth/telemetry@1.7.23"
  - better-auth@1.7.23
  - "@cloudflare/workers-types@5.20261114.1"
